<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 透明背景 -->
  <defs>
    <style>
      .logo-text { font-family: 'Arial', sans-serif; font-weight: bold; }
      .nuclear-symbol { fill: none; stroke: white; stroke-width: 2; }
      .nuclear-dot { fill: white; }
    </style>
  </defs>

  <!-- 中心圆形背景 - 已删除，使用透明背景 -->
  
  <!-- 核电符号 - 中心核 -->
  <circle cx="100" cy="100" r="25" class="nuclear-symbol" stroke="#d4af37" stroke-width="2.5"/>
  
  <!-- 核电符号 - 三个电子轨道 -->
  <ellipse cx="100" cy="100" rx="45" ry="30" class="nuclear-symbol" stroke="#d4af37" stroke-width="1.5" transform="rotate(0)"/>
  <ellipse cx="100" cy="100" rx="45" ry="30" class="nuclear-symbol" stroke="#d4af37" stroke-width="1.5" transform="rotate(60)"/>
  <ellipse cx="100" cy="100" rx="45" ry="30" class="nuclear-symbol" stroke="#d4af37" stroke-width="1.5" transform="rotate(120)"/>
  
  <!-- 三个电子 (金色) -->
  <circle cx="145" cy="100" r="5" class="nuclear-dot" fill="#d4af37"/>
  <circle cx="77.5" cy="63.4" r="5" class="nuclear-dot" fill="#d4af37"/>
  <circle cx="77.5" cy="136.6" r="5" class="nuclear-dot" fill="#d4af37"/>
  
  <!-- 中心核点 (白色) -->
  <circle cx="100" cy="100" r="6" class="nuclear-dot" fill="white"/>
  
  <!-- 上方 - 风险标识 (三角形) -->
  <g transform="translate(100, 35)">
    <polygon points="0,-8 8,8 -8,8" fill="none" stroke="#d4af37" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="0" cy="2" r="2" fill="#d4af37"/>
  </g>
  
  <!-- 左下 - 装置/设备标识 -->
  <g transform="translate(50, 140)">
    <rect x="-10" y="-8" width="20" height="12" fill="none" stroke="#d4af37" stroke-width="1.5" rx="2"/>
    <line x1="-6" y1="-8" x2="-6" y2="4" stroke="#d4af37" stroke-width="1"/>
    <line x1="0" y1="-8" x2="0" y2="4" stroke="#d4af37" stroke-width="1"/>
    <line x1="6" y1="-8" x2="6" y2="4" stroke="#d4af37" stroke-width="1"/>
  </g>
  
  <!-- 右下 - 防护标识 -->
  <g transform="translate(150, 140)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#d4af37" stroke-width="1.5"/>
    <path d="M -3,-5 L 0,0 L 3,-5" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
